<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="cftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="60%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Shape: Rounded Squircle -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#cftGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner border -->
  <rect x="9.5" y="9.5" width="101" height="101" rx="24.5" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Speed/Transit Accent Line -->
  <path d="M 22 88 Q 60 78 98 88" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- Bus Silhouette Icon -->
  <g transform="translate(28, 24)" fill="#FFFFFF">
    <!-- Bus Body -->
    <path d="M 10 0 C 4.5 0 0 4.5 0 10 L 0 42 C 0 46 3 49.5 7 50 L 7 55 C 7 57.2 8.8 59 11 59 L 14 59 C 16.2 59 18 57.2 18 55 L 18 50 L 46 50 L 46 55 C 46 57.2 47.8 59 50 59 L 53 59 C 55.2 59 57 57.2 57 55 L 57 50 C 61 49.5 64 46 64 42 L 64 10 C 64 4.5 59.5 0 54 0 Z" fill="#FFFFFF"/>
    
    <!-- Windshield -->
    <rect x="6" y="8" width="52" height="18" rx="4" fill="#0F172A" fill-opacity="0.85"/>
    
    <!-- Headlights -->
    <circle cx="12" cy="38" r="4" fill="#FBBF24"/>
    <circle cx="52" cy="38" r="4" fill="#FBBF24"/>
    
    <!-- Grille / Destination Display -->
    <rect x="22" y="3" width="20" height="3" rx="1.5" fill="#10B981"/>
    <rect x="22" y="37" width="20" height="3" rx="1.5" fill="#CBD5E1"/>
    <rect x="25" y="42" width="14" height="2" rx="1" fill="#94A3B8"/>
    
    <!-- Wheels -->
    <circle cx="12.5" cy="54" r="3" fill="#1E293B"/>
    <circle cx="51.5" cy="54" r="3" fill="#1E293B"/>
  </g>

  <!-- Location Pin / CFT Badge floating at bottom right -->
  <g transform="translate(74, 70)">
    <circle cx="16" cy="16" r="16" fill="#10B981" filter="url(#shadow)"/>
    <circle cx="16" cy="16" r="14" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    <!-- Graduation Cap / Book Symbol -->
    <path d="M 9 14 L 16 10 L 23 14 L 16 18 Z" fill="#FFFFFF"/>
    <path d="M 12 16.5 L 12 21 C 12 22.5 16 23.5 16 23.5 C 16 23.5 20 22.5 20 21 L 20 16.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <line x1="22" y1="14" x2="22" y2="19" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
